[workspace]
publish = false
changelog_path = "./CHANGELOG.md"
dependencies_update = true
semver_check = false
release_always = false
repo_url = "https://github.com/jpalczewski/kajet"
pr_labels = ["🚀 release"]

# Disable git releases/tags for all packages by default
git_release_enable = false
git_tag_enable = false

[changelog]
header = """# 📝 Changelog\n\nAll notable changes to this project will be documented in this file.\n"""
body = """
## [{{ version }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}💥 **BREAKING** {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "✨ Added" },
    { message = "^fix", group = "🐛 Fixed" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Changed" },
    { message = "^docs", group = "📚 Documentation" },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
]

commit_preprocessors = [
    { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/jpalczewski/kajet/pull/${1}))" },
]

# All crates share one version — version_group keeps them in sync
[[package]]
name = "kajet-core"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-parser"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-backend"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-indexer"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-mcp"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-web"
version_group = "kajet"
changelog_update = false

[[package]]
name = "kajet-writer"
version_group = "kajet"
changelog_update = false

# Root package — the only one with git tag/release and changelog
[[package]]
name = "kajet"
version_group = "kajet"
changelog_update = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "📓 kajet v{{ version }}"
git_release_body = """
{{ changelog }}

---

{% if remote.contributors %}
## 👥 Contributors

{% for contributor in remote.contributors %}
* [@{{ contributor.username }}](https://github.com/{{ contributor.username }})
{% endfor %}

{% endif %}
**Full Changelog**: https://github.com/jpalczewski/kajet/compare/{{ previous_version }}...v{{ version }}
"""
