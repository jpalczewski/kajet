<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📓 kajet</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: #0a0a0a; color: #c8c8c8;
      padding: 1.5rem; max-width: 1400px; margin: 0 auto;
    }

    header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.4rem; color: #fff; }
    header span { color: #555; font-size: 0.8rem; }
    .status { color: #4a4; font-size: 0.75rem; }
    .status.disconnected { color: #a44; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: #111; border: 1px solid #222;
      border-radius: 8px; padding: 1rem;
      max-height: 70vh; overflow-y: auto;
    }
    .panel h2 {
      color: #666; font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .search-panel { grid-column: span 2; }
    @media (max-width: 900px) { .search-panel { grid-column: span 1; } }

    input[type="text"] {
      background: #1a1a1a; border: 1px solid #333; color: #fff;
      padding: 0.6rem 0.8rem; width: 100%; border-radius: 6px;
      font-family: inherit; font-size: 0.85rem; outline: none;
    }
    input[type="text"]:focus { border-color: #555; }
    input[type="text"]::placeholder { color: #444; }

    .chunk {
      background: #161616; padding: 0.6rem 0.8rem;
      margin: 0.4rem 0; border-radius: 6px;
      border-left: 3px solid #333;
    }
    .chunk .breadcrumb {
      color: #777; font-size: 0.7rem; margin-bottom: 0.3rem;
    }
    .chunk .content {
      font-size: 0.8rem; line-height: 1.5;
      color: #bbb; white-space: pre-wrap;
      max-height: 6rem; overflow: hidden;
    }
    .chunk .score {
      display: inline-block; margin-top: 0.3rem;
      color: #5a5; font-size: 0.7rem; font-weight: 600;
    }

    .event {
      padding: 0.3rem 0; border-bottom: 1px solid #1a1a1a;
      font-size: 0.78rem; display: flex; gap: 0.5rem;
    }
    .event .time { color: #555; flex-shrink: 0; }
    .event .query { color: #7af; }
    .event .count { color: #5a5; }

    .empty { color: #555; font-size: 0.8rem; padding: 1rem; text-align: center; }
    .error { color: #d55; font-size: 0.8rem; padding: 0.5rem; }

    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .spinner { color: #555; font-size: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <h1>📓 <span data-i18n="title">kajet</span></h1>
    <span data-i18n="subtitle">obsidian vault search</span>
    <span id="ws-status" class="status" data-i18n="ws_connecting">connecting...</span>
  </header>

  <div class="grid">
    <!-- Live MCP query log -->
    <div class="panel">
      <h2 data-i18n="panel_query_log">mcp query log</h2>
      <div id="events">
        <div class="empty" data-i18n="waiting_for_queries">Waiting for queries from Claude...</div>
      </div>
    </div>

    <!-- Reserved for future panels -->
    <div class="panel">
      <h2 data-i18n="panel_stats">stats</h2>
      <div id="stats" class="empty" data-i18n="stats_message">
        Dashboard running. Search below or use via MCP.
      </div>
    </div>

    <!-- Search playground -->
    <div class="panel search-panel">
      <h2 data-i18n="panel_search">search playground</h2>
      <div style="position: relative;">
        <input type="text"
               name="q"
               placeholder="search your vault..."
               data-i18n-placeholder="search_placeholder"
               hx-get="/api/search"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#results"
               hx-indicator="#search-spinner" />
        <span id="search-spinner" class="htmx-indicator spinner" data-i18n="searching">searching...</span>
      </div>
      <div id="results" style="margin-top: 0.5rem;"></div>
    </div>
  </div>

  <script>
    // i18n — load translations from server
    window._t = {};

    async function loadI18n() {
      try {
        const resp = await fetch('/api/i18n');
        const t = await resp.json();
        window._t = t;

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (t[key]) el.textContent = t[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (t[key]) el.placeholder = t[key];
        });
      } catch (e) {
        // Fallback: keep English defaults from HTML
      }
    }

    // WebSocket for live MCP query events
    let ws;
    const statusEl = document.getElementById('ws-status');
    const eventsEl = document.getElementById('events');

    function createEventElement(data) {
      const el = document.createElement('div');
      el.className = 'event';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = new Date(data.timestamp).toLocaleTimeString();

      const querySpan = document.createElement('span');
      querySpan.className = 'query';
      querySpan.textContent = data.query;

      const countSpan = document.createElement('span');
      countSpan.className = 'count';
      const suffix = window._t.results_suffix || 'results';
      countSpan.textContent = '\u2192 ' + data.num_results + ' ' + suffix;

      el.appendChild(timeSpan);
      el.appendChild(querySpan);
      el.appendChild(countSpan);
      return el;
    }

    function connectWs() {
      ws = new WebSocket('ws://' + location.host + '/ws');

      ws.onopen = () => {
        statusEl.textContent = window._t.ws_connected || '\u25CF connected';
        statusEl.className = 'status';
      };

      ws.onclose = () => {
        statusEl.textContent = window._t.ws_disconnected || '\u25CF disconnected';
        statusEl.className = 'status disconnected';
        setTimeout(connectWs, 2000);
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        // Remove "waiting" placeholder
        const empty = eventsEl.querySelector('.empty');
        if (empty) empty.remove();

        eventsEl.prepend(createEventElement(data));

        // Keep max 50 events
        while (eventsEl.children.length > 50) {
          eventsEl.lastChild.remove();
        }
      };
    }

    // Init
    loadI18n();
    connectWs();
  </script>

</body>
</html>
