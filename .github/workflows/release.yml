name: Release

on:
  push:
    branches: [develop]
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  prepare-release:
    name: Create Release PR
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: knope-prepare-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      - uses: knope-dev/action@v2.1.0
        with:
          version: 0.22.2
      - run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  release:
    name: Create GitHub Release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.head_ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: knope-dev/action@v2.1.0
        with:
          version: 0.22.2
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
