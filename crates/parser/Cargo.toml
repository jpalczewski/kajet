[package]
name = "kajet-parser"
version = "0.2.1"
edition = "2024"

[dependencies]
ignore = "0.4"
pulldown-cmark = "0.13"
anyhow = "1"
thiserror = "2"
regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = "0.4"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros"] }
