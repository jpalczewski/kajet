[package]
name = "kajet-web"
version = "0.1.0"
edition = "2021"

[dependencies]
kajet-core = { path = "../core" }

axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
tokio = { version = "1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-i18n = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "net"] }
