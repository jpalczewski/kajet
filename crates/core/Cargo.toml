[package]
name = "kajet-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
kajet-parser = { path = "../parser" }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
config = { version = "0.15", features = ["toml"] }
toml = "0.8"
dirs = "6"
rust-i18n = "3"

[features]
test-utils = []

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "sync"] }
tempfile = "3"
