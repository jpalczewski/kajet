[package]
name = "kajet-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
kajet-core = { path = "../core" }

# Embeddings
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
hf-hub = { version = "0.4", features = ["tokio"] }
tokenizers = "0.22"

# Vector store
lancedb = { version = "0.26", default-features = false }
lance-index = "2"
arrow-array = "57"
arrow-schema = "57"
lzma-sys = { version = "*", features = ["static"] }

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Common
serde = { version = "1", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
serde_json = "1"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

# Metal GPU acceleration on macOS
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
candle-transformers = { version = "0.9", features = ["metal"] }
