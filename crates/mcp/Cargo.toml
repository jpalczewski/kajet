[package]
name = "kajet-mcp"
version = "0.2.1"
edition = "2024"

[dependencies]
kajet-core = { path = "../core" }
kajet-writer = { path = "../writer" }

rmcp = { version = "0.14", features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
rust-i18n = "3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
